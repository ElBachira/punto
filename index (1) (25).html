<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdeef4">
<title>Felipe Moreno Gonzaga · Bachira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Parisienne&family=Patrick+Hand&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<!-- dibujos que se reutilizan: regalo de Navidad (puertas sin bot) y el icono de amigos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8db4"/><stop offset="1" stop-color="#d42a6b"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb8d2"/><stop offset="1" stop-color="#f0629a"/></linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#e8a323"/></linearGradient>
    <linearGradient id="gW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4c2f4"/></linearGradient>

    <symbol id="gift" viewBox="0 0 64 64">
      <g stroke="#2a0a1d" stroke-width="1.6" stroke-linejoin="round">
        <rect x="11" y="32" width="42" height="25" rx="4" fill="url(#gA)"/>
        <rect x="8" y="23" width="48" height="12" rx="3.5" fill="url(#gB)"/>
        <rect x="28" y="23" width="8" height="34" fill="url(#gC)"/>
        <path d="M32 23C25 8 11 11 15 19c3 5 13 4 17 4Z" fill="url(#gC)"/>
        <path d="M32 23C39 8 53 11 49 19c-3 5-13 4-17 4Z" fill="url(#gC)"/>
        <circle cx="32" cy="22.5" r="4.3" fill="url(#gC)"/>
      </g>
      <g fill="#fff">
        <path d="M13 39.5L14.4 42.6 17.5 44 14.4 45.4 13 48.5 11.6 45.4 8.5 44 11.6 42.6Z" opacity=".9"/>
        <path d="M8 7l.9 2.1L11 10l-2.1.9L8 13l-.9-2.1L5 10l2.1-.9Z"/>
        <circle cx="46" cy="51" r="1.5"/><circle cx="20" cy="53" r="1.1"/>
      </g>
      <path d="M58 3l.9 2.1L61 6l-2.1.9L58 9l-.9-2.1L55 6l2.1-.9Z" fill="#fff3b0"/>
    </symbol>

    <!-- amigos: dos personitas abrazadas con un corazón encima -->
    <symbol id="amigos" viewBox="0 0 64 64">
      <g stroke="#2a0a1d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M30 57C30 45 36.5 39 45 39S60 45 60 57Z" fill="url(#gC)"/>
        <circle cx="45" cy="26" r="9" fill="url(#gC)"/>
        <path d="M3 60C3 47 11.5 41 23 41S43 47 43 60Z" fill="url(#gW)"/>
        <circle cx="23" cy="28" r="10.5" fill="url(#gW)"/>
        <path d="M34 15.5C28 11 26.5 7.5 28 5.3C29.5 3.1 32.6 3.5 34 6.1C35.4 3.5 38.5 3.1 40 5.3C41.5 7.5 40 11 34 15.5Z" fill="#ff4f9a"/>
      </g>
      <path d="M14 23c2-3.2 5.6-4.8 9.4-4.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/>
      <path d="M8 9l.9 2.1L11 12l-2.1.9L8 15l-.9-2.1L5 12l2.1-.9Z" fill="#fff"/>
      <path d="M57 8l.8 1.9L60 11l-2.2.9L57 14l-.8-2.1L54 11l2.2-1.1Z" fill="#fff3b0"/>
    </symbol>
  </defs>
</svg>

<div class="fit"><main class="win">

  <!-- lucecitas de Navidad sobre el marco -->
  <div class="lights" aria-hidden="true"><i></i><i></i></div>

  <div class="in">

    <!-- 1 · barra de navegador: título, amigos y cartita -->
    <header class="bar">
      <span class="dots" aria-hidden="true"><i class="fas fa-house"></i><i class="fas fa-rotate-right"></i><i class="fas fa-magnifying-glass"></i></span>
      <div class="url"><span id="url"></span></div>
      <div class="acts">
        <button class="tab" id="wf" type="button" aria-label="Amigos creadores"><svg class="ico" aria-hidden="true"><use href="#amigos"/></svg></button>
        <button class="tab" id="wb" type="button" aria-label="Abrir mensaje de bienvenida"><i class="fas fa-envelope-open-text"></i></button>
      </div>
    </header>

    <!-- 2 · ficha de datos: Nombre, Edad, Ocupación... con iconos (se llena desde script.js) -->
    <section class="pan ficha" id="ficha" aria-label="Datos del personaje">
      <h2 class="pill"><i class="fas fa-leaf" aria-hidden="true"></i><span>Ficha de datos</span></h2>
      <div class="fgrid" id="fgrid"></div>
    </section>

    <!-- 3 · cuerpo: a la izquierda nombre, frase, rating y reproductor; a la derecha foto, enlaces y letra -->
    <section class="body">

      <div class="main">
        <h1 id="name"></h1>
        <div class="desc" id="desc"></div>

        <section class="pan rate">
          <h2 class="pill"><i class="fas fa-star" aria-hidden="true"></i><span>Rating</span></h2>
          <div class="rating" id="rating"></div>
        </section>

        <div class="player">
          <div class="prow">
            <div class="cover">
              <span class="disc" aria-hidden="true"><i class="fas fa-music"></i></span>
              <img id="dimg" alt="">
            </div>
            <div class="pinfo"><p id="st"></p><small id="sa"></small></div>
            <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <button class="like" id="lk" type="button" aria-label="Me gusta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
          </div>
          <div class="row2">
            <div class="ctl">
              <button id="prev" class="sq" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5" width="3" height="14" rx="1.3"/><path d="M19.5 6.2v11.6a1 1 0 0 1-1.6.8l-8.1-5.8a1 1 0 0 1 0-1.6l8.1-5.8a1 1 0 0 1 1.6.8z"/></svg></button>
              <button id="pp" class="pp" type="button" aria-label="Reproducir o pausar">
                <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>
                <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.4" height="14" rx="1.6"/><rect x="13.6" y="5" width="4.4" height="14" rx="1.6"/></svg>
              </button>
              <button id="next" class="sq" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.5" y="5" width="3" height="14" rx="1.3"/><path d="M4.5 6.2v11.6a1 1 0 0 0 1.6.8l8.1-5.8a1 1 0 0 0 0-1.6L6.1 5.4a1 1 0 0 0-1.6.8z"/></svg></button>
            </div>
            <div class="prog">
              <span id="cur">0:00</span>
              <div class="track" id="trk" role="slider" tabindex="0" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
              <span id="dur">0:00</span>
            </div>
          </div>
        </div>
      </div>

      <aside class="side">
        <div class="ver" id="ver"></div>
        <figure class="photo"><img id="img" alt="Retrato del personaje"></figure>
        <nav class="plats" id="plats" aria-label="Dónde chatear con el bot"></nav>

        <!-- letra de la canción (se llena desde script.js) -->
        <div class="lyr" id="lyr">
          <h3 class="pill"><span>Letra</span></h3>
          <div id="lall"></div>
        </div>
      </aside>

    </section>

    <!-- 4 · etiquetas -->
    <div class="tags" id="tags"></div>

    <!-- 5 · calendario de adviento: los demás bots, Masculinos y Femeninos (se llena desde script.js) -->
    <section class="pan cal" id="cal" aria-label="Calendario de adviento">
      <h2 class="pill big" id="note"></h2>
      <div class="strip" id="strip"></div>
    </section>

  </div>
</main></div>

<!-- ventana: bienvenida y presentación (la cartita) -->
<div class="modal" id="m-wel" role="dialog" aria-modal="true" aria-label="Bienvenida">
  <div class="dlg wel">
    <button class="x" type="button" aria-label="Cerrar"><i class="fas fa-xmark"></i></button>
    <div id="wel"></div>
  </div>
</div>

<!-- ventana: amigos creadores -->
<div class="modal" id="m-fri" role="dialog" aria-modal="true" aria-label="Amigos creadores">
  <div class="dlg fri">
    <button class="x" type="button" aria-label="Cerrar"><i class="fas fa-xmark"></i></button>
    <div id="fri"></div>
  </div>
</div>

<!-- ventana: regalo que todavía no llega -->
<div class="modal" id="m-gift" role="dialog" aria-modal="true" aria-label="Regalo sorpresa">
  <div class="dlg letter">
    <button class="x" type="button" aria-label="Cerrar"><i class="fas fa-xmark"></i></button>
    <svg class="bigift" aria-hidden="true"><use href="#gift"/></svg>
    <div class="orn" aria-hidden="true">❄ ♡ ❄</div>
    <h3 id="gt">Regalo</h3>
    <p>Este regalo llegará pronto ♡</p>
    <p>Todavía lo estoy envolviendo con muchísimo cariño y un moño dorado. Vuelve a abrir esta puerta muy pronto: vale la pena esperar.</p>
    <p class="sign"><span>Bachira</span> ♡</p>
  </div>
</div>

<audio id="au" preload="none"></audio>
<script src="https://elbachira.github.io/bots.js?v=1.0"></script>
<script src="script.js"></script>
</body>
</html>
